apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dynamic-web-ingress
  namespace: default
  annotations:
    # Forces HTTP traffic to instantly redirect to secure HTTPS Port 443
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Strips the "/api" prefix before handing traffic to your backend container
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - mytestdemo.local
    secretName: my-tls-secret    # Hooks up your secure 443 certificate secret
  rules:
  - host: mytestdemo.local        # Your custom local domain
    http:
      paths:
      
      # PATH 1: Main Website Frontend (Points to deploy.yaml)
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: my-web-app
            port:
              number: 80
              
      # PATH 2: Backend API (Points to any-deploy.yaml)
      - path: /api/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: my-api-service
            port:
              number: 80

